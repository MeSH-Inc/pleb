[package]
name = "mesh-wick"
version = "0.1.0"
edition = "2021"
description = "Local browser-grade web fetch and search CLI for AI agents"
license = "MIT"

[lib]
name = "mesh_wick"
path = "src/lib.rs"

[[bin]]
name = "wick"
path = "src/main.rs"

[features]
# Enable Cronet for Chrome-identical TLS/HTTP2/QUIC fingerprinting.
# Without this, falls back to reqwest (rustls TLS).
cronet = []

[dependencies]
anyhow = "1.0"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
ego-tree = "0.11"
htmd = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "brotli", "deflate", "socks", "json"] }
robotstxt = "0.3"
scraper = "0.26.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "signal", "sync", "time", "process", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
urlencoding = "2.1.3"

[build-dependencies]
cc = "1.0"
